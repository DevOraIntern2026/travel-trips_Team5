<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Google Login Test</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <h2>DevOra Google Login Test</h2>

  <div
    id="g_id_onload"
    data-client_id="609132022703-ig36g87q8iesmcubk3bakt1cl0ae9vj1.apps.googleusercontent.com"
    data-callback="handleCredentialResponse">
  </div>

  <div class="g_id_signin"></div>

  <script>
    function handleCredentialResponse(response) {
      console.log("Google ID Token:");
      console.log(response.credential);

      document.body.innerHTML += `
        <p>Google Login Success</p>
        <textarea style="width: 90%; height: 200px;">
${response.credential}
        </textarea>
      `;
    }
  </script>

</body>
</html>
